# Pass to JMeter with: -q loadtest/triage.properties
# Makes every .jtl a CSV with the columns scripts/summarise_jtl.py and scripts/reconcile.py expect.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.url=true
# Adds the request ID (matches the service log) and source row to each sample.
sample_variables=rid,row

# Some platforms leave non-daemon JVM threads alive after a successful CLI run.
# Force a clean exit only after JMeter has notified end-of-test listeners.
jmeterengine.force.system.exit=true
